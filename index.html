    <script>
      // AI Studio iframe proxy ortamında zararsız Vite WebSocket HMR uyarılarını yakala ve engelle
      window.addEventListener('unhandledrejection', function(event) {
        var reasonStr = String(event?.reason?.message || event?.reason || '');
        if (reasonStr.includes('WebSocket') || reasonStr.includes('ws') || reasonStr.includes('closed without opened')) {
          event.preventDefault();
        }
      });
    </script>
