name: Verify Mushaf reader safety and diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm install --legacy-peer-deps
      - name: Verify embedded reader and diagnostic tests
        run: npx tsx --test tests/mushafDiagnostics.test.ts
      - name: Verify production bundle
        run: npx vite build
