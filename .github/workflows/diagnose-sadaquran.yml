name: Diagnose SadaQuran HLS connectivity
on:
  push:
    paths:
      - '.github/workflows/diagnose-sadaquran.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe live HLS manifest, CORS and station page
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, urllib.parse, ssl
          urls = [
            "https://manifest.aweradio.app/sadaquran/music/aac.m3u8",
            "https://sadaquran.aweradio.app/",
            "https://aweradio.app/@sadaquran",
          ]
          for url in urls:
            print("\n=== ", url, " ===", flush=True)
            req = urllib.request.Request(url, headers={
              "User-Agent": "Mozilla/5.0 (compatible; SadaQuran-Diagnostics/1.0)",
              "Origin": "https://selimuysal.github.io"
            })
            try:
              with urllib.request.urlopen(req, timeout=15) as response:
                body = response.read(4096).decode('utf-8', 'replace')
                print("STATUS:", response.status)
                print("FINAL_URL:", response.url)
                for name in ["content-type", "access-control-allow-origin", "access-control-allow-credentials", "cross-origin-resource-policy", "x-frame-options", "content-security-policy", "location"]:
                  print(name + ":", response.headers.get(name))
                print("BODY_START:", repr(body[:650]))
                if "m3u8" in url and body.startswith("#EXTM3U"):
                  lines=[v.strip() for v in body.splitlines()]
                  for line in lines:
                    if line and not line.startswith("#"):
                      item=urllib.parse.urljoin(response.url,line)
                      print("FIRST_PLAYLIST_CHILD:",item)
                      try:
                        sub_req=urllib.request.Request(item, headers={"Origin":"https://selimuysal.github.io","User-Agent":"Mozilla/5.0"})
                        with urllib.request.urlopen(sub_req,timeout=12) as seg:
                          print("CHILD_STATUS:",seg.status,"CHILD_TYPE:",seg.headers.get("content-type"),"CHILD_CORS:",seg.headers.get("access-control-allow-origin"),"CHILD_LEN:",seg.headers.get("content-length"))
                      except Exception as e: print("CHILD_ERROR:",str(e)[:250])
                      break
            except urllib.error.HTTPError as e:
              print("HTTP_ERROR:",e.code, "BODY:",repr(e.read(450).decode('utf-8','replace')))
              for name in ["access-control-allow-origin","content-type","server"]:
                print(name + ":",e.headers.get(name))
            except Exception as e:
              print("REQUEST_ERROR:",type(e).__name__,str(e)[:300])
          PY
