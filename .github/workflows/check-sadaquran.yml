name: Validate SadaQuran radio integration
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm install --legacy-peer-deps
      - name: Verify tab routes and guarded radio embed
        run: npx tsx --test tests/sadaquranRadio.test.ts
      - name: Production build
        run: npx vite build
