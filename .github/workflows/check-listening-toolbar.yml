name: Check Listening toolbar responsive layout
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm install --legacy-peer-deps
      - name: Responsive toolbar checks
        run: npx tsx --test tests/listeningToolbar.test.ts
      - name: Vite build
        run: npx vite build
