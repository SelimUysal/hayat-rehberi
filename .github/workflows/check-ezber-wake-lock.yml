name: Verify Ezber screen wake lock
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm install --legacy-peer-deps
      - run: npx tsx --test tests/ezberWakeLock.test.ts
      - run: npx vite build
