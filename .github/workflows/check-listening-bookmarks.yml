name: Validate Listening manual bookmarks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm install --legacy-peer-deps
      - name: Test manual bookmarks and automatic-resume isolation
        run: npx tsx --test tests/listeningBookmarks.test.ts
      - name: Production build
        run: npx vite build
