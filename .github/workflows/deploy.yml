name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Check TypeScript
        run: npm run lint

      - name: Guard all unit and playback regressions before deployment
        run: npm run test:unit

      - name: Install Playwright Chromium for cloud regression tests
        run: npx playwright install --with-deps chromium

      - name: Verify Firebase rules, authentication, offline recovery and cross-device behavior
        run: npx -y firebase-tools@15.34.2 emulators:exec --only firestore,auth --project demo-hayat-rehberi "npm run test:cloud:integration && npm run test:cloud:e2e"

      - name: Retain cloud browser diagnostics if a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Build static site with Vite
        run: npx vite build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
