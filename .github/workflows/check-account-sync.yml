name: Firebase account and synchronization checks
on:
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: "account-sync-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  account-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --legacy-peer-deps
      - name: Validate all unit and regression tests
        run: npm run test:unit
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Test rules, authentication, offline recovery and every durable screen on desktop and mobile
        run: npx -y firebase-tools@15.34.2 emulators:exec --only firestore,auth --project demo-hayat-rehberi "npm run test:cloud:integration && npm run test:cloud:e2e"
      - name: Build production site
        run: npx vite build
      - name: Retain browser diagnostics if a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
