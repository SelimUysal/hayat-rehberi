name: Check listening player changes

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Run continuous-listening regression tests
        run: npx tsx --test tests/listeningPlaybackGuards.test.ts tests/listeningContinuity.test.tsx
      - name: Verify production build
        run: npx vite build
