name: Check namaz prayer and diagnostic changes

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm install --legacy-peer-deps
      - name: Namaz content and diagnostics regression tests
        run: npx tsx --test tests/namazMode.test.ts tests/prayerAdhanScheduling.test.ts
      - name: Browser navigation and direct subpage link tests
        run: npx tsx --test tests/appRouteLink.test.tsx tests/surahDeepLinks.test.ts
      - name: Production build
        run: npx vite build
